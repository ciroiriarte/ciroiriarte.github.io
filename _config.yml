# Site settings. This file is not reloaded by `jekyll serve`; restart after editing.

title: Doing the blog thing
description: >-
  These are personal notes I believe would like to recall at some point in time,
  sharing them to the wind...
baseurl: ""
url: "https://iriarte.it"
lang: en
timezone: America/Asuncion

twitter:
  username: ciroiriarte
google_site_verification: wLRgHwF6nai9tTLgxgfnssURwBRLZG68NZtpiEPMN94

# Analytics. Both are emitted only when JEKYLL_ENV=production.
google_analytics: G-ZZ8BN39FB0
# Cookieless counter: create a site at https://www.goatcounter.com and put its
# code here (e.g. `iriarte` for iriarte.goatcounter.com). Empty = disabled.
goatcounter:

# Source repository, used for "Edit on GitHub" links.
repository: ciroiriarte/ciroiriarte.github.io
branch: main

permalink: /:year/:month/:day/:title.html

# Translations: _translations/<lang>/<same filename as the post>.md, with
# permalink "/<lang>" + the original's permalink. See README.
collections:
  translations:
    output: true
excerpt_separator: <!--more-->

remote_theme: jekyll/minima@4de322363fca5927e6f4012cb94f6dad69ab5e6c
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-remote-theme
  - jekyll-redirect-from

minima:
  skin: auto
  show_excerpts: true
  date_format: "%b %-d, %Y"
  nav_pages:
    - topics.md
    - tags.md
    - archive.md
    - search.md
    - about.markdown

sass:
  quiet_deps: true
  silence_deprecations: [import]

exclude:
  - CLAUDE.md
  - pagefind.yml
  - scripts/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - .ruby-version

jekyll_compose:
  default_front_matter:
    drafts:
      description:
      image:
      lang: en
      categories:
      tags:
    posts:
      description:
      image:
      lang: en
      categories:
      tags:

defaults:
  # Social card image for every page (jekyll-seo-tag); a page's own `image:`
  # wins. With an image, seo-tag emits twitter:card summary_large_image.
  - scope:
      path: ""
    values:
      image: /assets/img/og-default.png
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Ciro Iriarte
  - scope:
      path: ""
      type: translations
    values:
      layout: post
      author: Ciro Iriarte
