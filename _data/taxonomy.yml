# Controlled vocabulary for post classification.
# Every post's `categories` must be topic keys and `tags` must be tag keys.
# Keys are URL anchors on /topics/ and /tags/; `name` is what readers see.

topics:
  linux:           { name: "Linux & Unix", description: "System administration on SLES, openSUSE and friends." }
  virtualization:  { name: "Virtualization", description: "Proxmox VE, ESXi, OpenStack and cloud images." }
  networking:      { name: "Networking", description: "Data center fabrics, SDN, Juniper and overlays." }
  storage-backup:  { name: "Storage & Backup", description: "SAN, ZFS, Proxmox Backup Server and tape." }
  security:        { name: "Security & Identity", description: "SSH, TLS, LDAP/FreeIPA and MFA." }
  monitoring:      { name: "Monitoring", description: "Nagios, Observium and friends." }
  misc:            { name: "Misc", description: "Gadgets, announcements and nonsense." }

