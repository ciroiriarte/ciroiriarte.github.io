# Pagefind search index, built after `jekyll build` (see .github/workflows/pages.yml).
site: _site
# One index for every language, so any version is found from any page; the
# "Language" filter in the search UI narrows it down.
force_language: en
# Post listings repeat every title; leave them out so results point at posts.
exclude_selectors:
  - ".post-list"
  - ".post-list-compact"
  - ".tag-cloud"
  - ".topic-index"
  - ".year-index"
  - ".home-series"
  - ".post-pager"
  - ".series-nav"
  - ".author-box"
  - ".post-edit"
  - ".post-meta"
  - ".post-taxonomy"
  - ".lang-switch"
  - ".notice-translation"
