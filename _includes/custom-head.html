<link rel="icon" href="{{ '/assets/img/avatar.jpg' | relative_url }}">
<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
{%- if jekyll.environment == 'production' and site.goatcounter %}
<script data-goatcounter="https://{{ site.goatcounter }}.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
{%- endif %}
{%- if page.collection == "posts" or page.collection == "translations" -%}
  {%- include i18n-versions.html -%}
  {%- if i18n_versions.size > 1 -%}
    {%- for v in i18n_versions %}
<link rel="alternate" hreflang="{{ v.lang }}" href="{{ v.url | absolute_url }}">
    {%- endfor %}
<link rel="alternate" hreflang="x-default" href="{{ i18n_original.url | default: page.url | absolute_url }}">
  {%- endif -%}
{%- endif %}
